<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1204" height="223.2" viewBox="-424.8888888889 0 1337.7777777778 248" role="img" aria-labelledby="title desc">
  <ns0:defs><ns0:filter id="codex-white-label-bg" x="-12%" y="-20%" width="124%" height="140%"><ns0:feFlood flood-color="#ffffff" result="white" /><ns0:feGaussianBlur in="white" stdDeviation="2" result="soft" /><ns0:feComponentTransfer in="soft" result="rounded"><ns0:feFuncA type="discrete" tableValues="0 0 1 1" /></ns0:feComponentTransfer><ns0:feMerge><ns0:feMergeNode in="rounded" /><ns0:feMergeNode in="SourceGraphic" /></ns0:feMerge></ns0:filter></ns0:defs><ns0:title id="title">带权路径长度示例</ns0:title>
  <ns0:desc id="desc">四个叶子的权值依次为 2、3、4、7；每个叶子到根的路径长均为 2，因此 WPL 为 32；</ns0:desc>
  
  <ns0:line x1="244" y1="34" x2="145" y2="98" stroke="#607487" stroke-width="1.5" stroke-linecap="round" />
  <ns0:line x1="244" y1="34" x2="343" y2="98" stroke="#607487" stroke-width="1.5" stroke-linecap="round" />
  <ns0:line x1="145" y1="98" x2="90" y2="169" stroke="#607487" stroke-width="1.5" stroke-linecap="round" />
  <ns0:line x1="145" y1="98" x2="200" y2="169" stroke="#607487" stroke-width="1.5" stroke-linecap="round" />
  <ns0:line x1="343" y1="98" x2="288" y2="169" stroke="#607487" stroke-width="1.5" stroke-linecap="round" />
  <ns0:line x1="343" y1="98" x2="398" y2="169" stroke="#607487" stroke-width="1.5" stroke-linecap="round" />
  <ns0:circle cx="244" cy="34" r="15" fill="#E7EAEC" stroke="#33485C" stroke-width="1.5" />
  <ns0:circle cx="145" cy="98" r="15" fill="#E7EAEC" stroke="#33485C" stroke-width="1.5" />
  <ns0:circle cx="343" cy="98" r="15" fill="#E7EAEC" stroke="#33485C" stroke-width="1.5" />
  <ns0:circle cx="90" cy="169" r="15" fill="#FFFFFF" stroke="#33485C" stroke-width="1.5" /><ns0:text x="90" y="170" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="16" font-weight="600" fill="#111417">2</ns0:text>
  <ns0:circle cx="200" cy="169" r="15" fill="#FFFFFF" stroke="#33485C" stroke-width="1.5" /><ns0:text x="200" y="170" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="16" font-weight="600" fill="#111417">3</ns0:text>
  <ns0:circle cx="288" cy="169" r="15" fill="#FFFFFF" stroke="#33485C" stroke-width="1.5" /><ns0:text x="288" y="170" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="16" font-weight="600" fill="#111417">4</ns0:text>
  <ns0:circle cx="398" cy="169" r="15" fill="#FFFFFF" stroke="#33485C" stroke-width="1.5" /><ns0:text x="398" y="170" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="16" font-weight="600" fill="#111417">7</ns0:text>
  <ns0:text x="244" y="222" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="16" font-weight="500" fill="#33485C" filter="url(#codex-white-label-bg)">WPL = 2×2 + 3×2 + 4×2 + 7×2 = 32</ns0:text>
</ns0:svg>