<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1038.24pt" height="181pt" viewBox="0 0 1038.24 181" role="img" aria-labelledby="title desc">
  <title id="title">KMP next 数组失配后回退到更短真前后缀</title>
  <desc id="desc">一排 Pattern 中的短前后缀与长前后缀；两个等宽等高的紫色虚线框分别标出 suffix′ 与 prefix、prefix 与 suffix 的重叠区；</desc>
  <defs>
    <marker id="arrow-light-orange" markerWidth="7" markerHeight="7" refX="6.2" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#e5a08b"/>
    </marker>
    <marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6.2" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#c84b31"/>
    </marker>
    <marker id="arrow-light-blue" markerWidth="7" markerHeight="7" refX="6.2" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#83b8c9"/>
    </marker>
    <marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.2" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#1e5f74"/>
    </marker>
    <marker id="arrow-up" markerWidth="7" markerHeight="7" refX="3.5" refY="0.8" orient="0" markerUnits="userSpaceOnUse">
      <path d="M 0 7 L 3.5 0 L 7 7 Z" fill="#202830"/>
    </marker>
  </defs>

  <rect width="1038.24" height="181" fill="#ffffff"/>

  <!-- 与原图相同的横向分段；三个窄竖分均为 24pt； -->
  <rect x="20" y="48" width="978" height="64" rx="3.5" fill="#f5f7f8" stroke="#607487" stroke-width="1.5"/>
  <path d="M 382 48 V 112 M 406 48 V 112 M 680 48 V 112 M 704 48 V 112 M 974 48 V 112" fill="none" stroke="#607487" stroke-width="1.5"/>
  <rect x="998" y="48" width="24" height="64" fill="none" stroke="#33485c" stroke-width="1.6" stroke-dasharray="6 4"/>

  <!-- 两段等宽候选区间； -->
  <rect x="313" y="64" width="367" height="25" fill="none" stroke="#a52b94" stroke-width="1.6" stroke-dasharray="6 4"/>
  <rect x="607" y="80" width="367" height="25" fill="none" stroke="#a52b94" stroke-width="1.6" stroke-dasharray="6 4"/>

  <!-- 四条平行的水平箭头； -->
  <path d="M 24 59 H 378" fill="none" stroke="#e5a08b" stroke-width="2.1" marker-end="url(#arrow-light-orange)"/>
  <path d="M 317 73 H 676" fill="none" stroke="#83b8c9" stroke-width="2.1" marker-end="url(#arrow-light-blue)"/>
  <path d="M 21 84 H 676" fill="none" stroke="#c84b31" stroke-width="2.1" marker-end="url(#arrow-orange)"/>
  <path d="M 324 92.5 H 970" fill="none" stroke="#1e5f74" stroke-width="2.1" marker-end="url(#arrow-blue)"/>

  <g font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="21" font-style="italic" text-anchor="middle">
    <text x="202" y="36" fill="#e5a08b">prefix′</text>
    <text x="499" y="36" fill="#83b8c9">suffix′</text>
    <text x="276" y="139" fill="#c84b31">prefix</text>
    <text x="762" y="139" fill="#1e5f74">suffix</text>
  </g>

  <!-- 竖向指针等长、平行，并指向各竖分的中线； -->
  <g fill="none" stroke="#202830" stroke-width="1.8" marker-end="url(#arrow-up)">
    <path d="M 394 145 V 115"/>
    <path d="M 692 145 V 115"/>
    <path d="M 986 145 V 115"/>
    <path d="M 1010 145 V 115"/>
  </g>
  <g fill="#202830" font-family="Noto Sans CJK SC, Noto Sans, DejaVu Sans, sans-serif" font-size="16" text-anchor="middle">
    <text x="394" y="166">next[next[i-1]]</text>
    <text x="692" y="166">next[i-1]</text>
    <text x="986" y="166">i-1</text>
    <text x="1010" y="166">i</text>
  </g>
</svg>
